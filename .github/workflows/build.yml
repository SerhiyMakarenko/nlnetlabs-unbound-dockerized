name: Build image

# Branch model: work lands on develop (test-only builds); merging develop
# into stable is the release and publishes to Docker Hub.
on:
  push:
    branches: [stable, develop]
    paths: &build-paths
      - Dockerfile
      - docker-entrypoint.sh
      - test/**
      - .github/workflows/build.yml
  pull_request:
    paths: *build-paths
  schedule:
    # Monthly rebuild of stable with no cache, to pick up Debian security
    # fixes (OpenSSL, expat) even when Unbound itself hasn't changed.
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish half-way; superseded test builds can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/stable' }}

env:
  IMAGE: docker.io/serhiymakarenko/nlnetlabs-unbound-resolver
  PUBLISH: ${{ github.ref == 'refs/heads/stable' && github.event_name != 'pull_request' }}

jobs:
  # Skip test-only runs whose exact content (same git tree) already passed:
  # the push to develop after merging a tested PR, and a develop -> stable
  # PR whose merge result equals what develop already tested. Never applies
  # to pushes to stable or the monthly rebuild: those publish, so they always
  # build and test the image they push.
  dedupe:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      # For a PR this is the merge result GitHub would test, not the PR head.
      - uses: actions/checkout@v7

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          url=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&per_page=50" \
                --jq "[.workflow_runs[] | select(.head_commit.tree_id == \"$TREE\")] | first | .html_url // empty")
          if [ -n "$url" ]; then
            echo "::notice::Tree $TREE already passed CI in $url; skipping the rebuild."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: dedupe
    # dedupe only runs for pull requests and pushes to develop; build
    # regardless, unless it found an identical tree that already passed.
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' }}
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    # arm64 builds natively (free for public repos). There are no native
    # 32-bit ARM runners, so arm/v7 builds on amd64 under QEMU.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.platform == 'linux/arm/v7' && 90 || 30 }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          load: true
          tags: unbound:test
          labels: &labels |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test, current config layout
        run: bash test/smoke-test.sh unbound:test test/unbound.conf ${{ matrix.platform }}

      - name: Smoke test, legacy (2019-2021) config layout
        run: bash test/smoke-test.sh unbound:test test/legacy.conf ${{ matrix.platform }}

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: serhiymakarenko
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same builder, so every layer comes from the cache of the build that
      # was just tested; this step only pushes it.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: *labels
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch tags
    needs: build
    # Explicit result check: with a skipped dedupe upstream, the implicit
    # success() would skip this job even after a good build.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/stable' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push the vX.Y.Z tag and create the GitHub Release
    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: serhiymakarenko
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and tags
        id: publish
        run: |
          version=$(sed -n 's/^ARG UNBOUND_VERSION=//p' Dockerfile)
          minor=${version%.*}
          stamp=$(date -u +%Y%m%d)

          refs=()
          for d in /tmp/digests/*; do refs+=("$IMAGE@sha256:$(basename "$d")"); done
          [ "${#refs[@]}" -eq 3 ] || { echo "::error::expected 3 digests (amd64, arm64, arm/v7), got ${#refs[@]}"; exit 1; }

          # latest / 1.26 / 1.26.0 move with each rebuild;
          # 1.26.0-YYYYMMDD never changes, for rollbacks.
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$minor" \
            -t "$IMAGE:$version" \
            -t "$IMAGE:$version-$stamp" \
            "${refs[@]}"

          docker buildx imagetools inspect "$IMAGE:$version-$stamp"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      # One tag + GitHub Release per Unbound version (v1.26.1, ...), as in the
      # repo's history: created on the stable commit that first published it,
      # and only after the images are on Docker Hub. Monthly rebuilds of the
      # same version find the release and leave it alone. Checking for the
      # release (not the tag) lets a later run finish a half-done release.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.publish.outputs.version }}
          STAMP: ${{ steps.publish.outputs.stamp }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; this run was a rebuild."
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Unbound ${VERSION}" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION-$STAMP" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          repo_name=${GITHUB_REPOSITORY#*/}

          cat > /tmp/notes.md <<'EOF'
          Unbound @VERSION@ built from NLnet Labs' signed source release ([upstream release notes](https://github.com/NLnetLabs/unbound/releases/tag/release-@VERSION@)).

          ### Docker image
          Platforms: `linux/amd64`, `linux/arm64`, `linux/arm/v7`
          ```
          docker pull serhiymakarenko/nlnetlabs-unbound-resolver:@VERSION@
          ```
          The tags `@VERSION@` and `latest` move with the monthly rebuilds. `@VERSION@-@STAMP@` is this exact build and never changes.@DIGEST_LINE@

          ### Build it yourself
          ```
          git clone --branch v@VERSION@ https://github.com/@REPO@.git
          cd @REPO_NAME@
          docker build -t nlnetlabs-unbound-resolver .
          ```
          The Dockerfile pins the source tarball by SHA-256. That hash was recorded only after the tarball's OpenPGP signature verified against NLnet Labs' release key.
          EOF

          digest_line=""
          [ -n "$digest" ] && digest_line=" Manifest digest: \`${digest}\`."
          sed -i -e "s|@VERSION@|${VERSION}|g" -e "s|@STAMP@|${STAMP}|g" \
                 -e "s|@REPO@|${GITHUB_REPOSITORY}|g" -e "s|@REPO_NAME@|${repo_name}|g" \
                 -e "s|@DIGEST_LINE@|${digest_line}|" /tmp/notes.md

          # --notes is prepended to the notes GitHub generates from merged PRs.
          gh release create "$tag" --verify-tag --title "Unbound ${VERSION}" \
            --notes "$(cat /tmp/notes.md)" --generate-notes