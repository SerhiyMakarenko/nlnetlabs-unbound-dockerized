# Shaped like configs written for the 2019-2021 image: default chroot
# (/usr/local/etc/unbound) with the trust anchor inside it. Guards backward
# compatibility for existing users of the :latest tag.
server:
    interface: 0.0.0.0
    access-control: 0.0.0.0/0 allow
    do-ip6: no
    auto-trust-anchor-file: "/usr/local/etc/unbound/root.key"
    verbosity: 1
